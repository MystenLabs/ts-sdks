query listCheckpoints(
	$filter: CheckpointFilter
	$first: Int
	$after: String
	$last: Int
	$before: String
) {
	checkpoints(filter: $filter, first: $first, after: $after, last: $last, before: $before) {
		pageInfo {
			hasNextPage
			hasPreviousPage
			startCursor
			endCursor
		}
		nodes {
			...CHECKPOINT_FIELDS
		}
	}
}

fragment CHECKPOINT_FIELDS on Checkpoint {
	sequenceNumber
	digest
	timestamp
	epoch {
		epochId
	}
}
