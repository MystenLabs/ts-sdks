query simulateTransaction(
	$transaction: JSON!
	$includeTransaction: Boolean = false
	$includeEffects: Boolean = false
	$includeEvents: Boolean = false
	$includeBalanceChanges: Boolean = false
	$includeObjectTypes: Boolean = false
	$includeCommandResults: Boolean = false
	$includeBcs: Boolean = false
	$doGasSelection: Boolean = false
	$checksEnabled: Boolean = true
) {
	simulateTransaction(
		transaction: $transaction
		doGasSelection: $doGasSelection
		checksEnabled: $checksEnabled
	) {
		effects {
			transaction {
				...TRANSACTION_FIELDS
				effects {
					gasEffects {
						gasObject {
							address
						}
					}
				}
			}
		}
		outputs @include(if: $includeCommandResults) {
			returnValues {
				value {
					bcs
				}
			}
			mutatedReferences {
				value {
					bcs
				}
			}
		}
	}
}

mutation executeTransaction(
	$transactionDataBcs: Base64!
	$signatures: [Base64!]!
	$includeTransaction: Boolean = false
	$includeEffects: Boolean = false
	$includeEvents: Boolean = false
	$includeBalanceChanges: Boolean = false
	$includeObjectTypes: Boolean = false
	$includeBcs: Boolean = false
) {
	executeTransaction(transactionDataBcs: $transactionDataBcs, signatures: $signatures) {
		effects {
			transaction {
				...TRANSACTION_FIELDS
			}
		}
	}
}

query getTransactionBlock(
	$digest: String!
	$includeTransaction: Boolean = false
	$includeEffects: Boolean = false
	$includeEvents: Boolean = false
	$includeBalanceChanges: Boolean = false
	$includeObjectTypes: Boolean = false
	$includeBcs: Boolean = false
) {
	transaction(digest: $digest) {
		...TRANSACTION_FIELDS
	}
}

query listTransactions(
	$filter: TransactionFilter
	$first: Int
	$after: String
	$last: Int
	$before: String
	$includeTransaction: Boolean = false
	$includeEffects: Boolean = false
	$includeEvents: Boolean = false
	$includeBalanceChanges: Boolean = false
	$includeObjectTypes: Boolean = false
	$includeBcs: Boolean = false
) {
	transactions(filter: $filter, first: $first, after: $after, last: $last, before: $before) {
		pageInfo {
			hasNextPage
			hasPreviousPage
			startCursor
			endCursor
		}
		edges {
			cursor
		}
		nodes {
			...TRANSACTION_FIELDS
		}
	}
}

fragment TRANSACTION_FIELDS on Transaction {
	digest
	sender {
		address
	}
	transactionJson @include(if: $includeTransaction)
	transactionBcs @include(if: $includeBcs)
	signatures {
		signatureBytes
	}
	effects {
		status
		timestamp
		checkpoint {
			sequenceNumber
		}
		executionError {
			message
			abortCode
			identifier
			constant
			sourceLineNumber
			instructionOffset
			module {
				name
				package {
					address
				}
			}
			function {
				name
			}
		}
		epoch {
			epochId
		}
		effectsBcs @include(if: $includeEffects)
		effectsJson @include(if: $includeObjectTypes)
		objectChanges(first: 50) @include(if: $includeObjectTypes) {
			nodes {
				...TRANSACTION_OBJECT_CHANGE
			}
		}
		balanceChangesJson @include(if: $includeBalanceChanges)
		events(first: 50) @include(if: $includeEvents) {
			nodes {
				...TRANSACTION_EVENT
			}
		}
	}
}

fragment TRANSACTION_EVENT on Event {
	transactionModule {
		package {
			address
		}
		name
	}
	sender {
		address
	}
	contents {
		type {
			repr
		}
		bcs
		json
	}
}

fragment TRANSACTION_OBJECT_CHANGE on ObjectChange {
	address
	outputState {
		asMoveObject {
			contents {
				type {
					repr
				}
			}
		}
	}
}

query getTransactionObjectChanges($digest: String!, $after: String) {
	transaction(digest: $digest) {
		effects {
			objectChanges(first: 50, after: $after) {
				pageInfo {
					hasNextPage
					endCursor
				}
				nodes {
					...TRANSACTION_OBJECT_CHANGE
				}
			}
		}
	}
}

query getTransactionEvents($digest: String!, $after: String) {
	transaction(digest: $digest) {
		effects {
			events(first: 50, after: $after) {
				pageInfo {
					hasNextPage
					endCursor
				}
				nodes {
					...TRANSACTION_EVENT
				}
			}
		}
	}
}

query resolveTransaction(
	$transaction: JSON!
	$doGasSelection: Boolean = true
	$checksEnabled: Boolean = true
) {
	simulateTransaction(
		transaction: $transaction
		doGasSelection: $doGasSelection
		checksEnabled: $checksEnabled
	) {
		effects {
			transaction {
				transactionBcs
				effects {
					epoch {
						epochId
					}
					status
					executionError {
						message
						abortCode
						identifier
						constant
						sourceLineNumber
						instructionOffset
						module {
							name
							package {
								address
							}
						}
						function {
							name
						}
					}
				}
			}
		}
	}
}
