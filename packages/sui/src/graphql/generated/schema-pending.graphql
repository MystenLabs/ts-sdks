# Subscription arguments the service adds with progress edges, merged into schema.graphql for
# codegen. Progress edges have a null `node`.
# TODO: delete this file once schema.graphql is updated from a service that has them.
type Subscription {
	transactions(filter: TransactionFilter, after: String, progressInterval: Int): TransactionEdge!
	events(filter: EventFilter, after: String, progressInterval: Int): EventEdge!
}
