query listEvents($filter: EventFilter, $first: Int, $after: String, $last: Int, $before: String) {
	events(filter: $filter, first: $first, after: $after, last: $last, before: $before) {
		pageInfo {
			hasNextPage
			hasPreviousPage
			startCursor
			endCursor
		}
		edges {
			cursor
		}
		nodes {
			...EVENT_FIELDS
		}
	}
}

fragment EVENT_FIELDS on Event {
	sequenceNumber
	transaction {
		digest
		effects {
			checkpoint {
				sequenceNumber
			}
		}
	}
	transactionModule {
		package {
			address
		}
		name
	}
	sender {
		address
	}
	contents {
		type {
			repr
		}
		bcs
		json
	}
}
