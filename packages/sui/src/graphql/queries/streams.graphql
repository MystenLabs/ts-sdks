# Ledger streams use the list methods' fragments so streamed items match list results.

query ledgerStreamState {
	chainIdentifier
	checkpoint {
		sequenceNumber
	}
}

fragment STREAM_PAGE_INFO on PageInfo {
	hasNextPage
	hasPreviousPage
	startCursor
	endCursor
}

query scanCheckpoints(
	$filter: CheckpointFilter
	$filters: [String!]!
	$first: Int
	$after: String
	$last: Int
	$before: String
) {
	# The oldest checkpoint the filter's indexes retain, and the checkpoint this page was read at.
	serviceConfig {
		availableRange(type: "Query", field: "checkpoints", filters: $filters) {
			first {
				sequenceNumber
			}
			last {
				sequenceNumber
			}
		}
	}
	checkpoints(filter: $filter, first: $first, after: $after, last: $last, before: $before) {
		pageInfo {
			...STREAM_PAGE_INFO
		}
		edges {
			cursor
			node {
				...CHECKPOINT_FIELDS
			}
		}
	}
}

subscription subscribeCheckpoints($after: String, $afterCheckpoint: UInt53) {
	checkpoints(after: $after, afterCheckpoint: $afterCheckpoint) {
		cursor
		node {
			...CHECKPOINT_FIELDS
		}
	}
}

